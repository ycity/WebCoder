[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcoder"
version = "0.1.0"
description = "Cross-device file read/write for ChatGPT (web) and Codex over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hub = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=15", "cryptography>=42", "httpx[socks]>=0.27", "tzdata>=2024.1"]
agent = ["websockets>=15", "cryptography>=42", "regex>=2024.4"]
dev = ["pytest>=8", "httpx>=0.27", "mcp>=2.2", "playwright>=1.50", "jsonschema>=4.18", "regex>=2024.4"]

[project.scripts]
webcoder-hub = "webcoder.hub.__main__:main"
webcoder-agent = "webcoder.agent.__main__:main"
webcoder-bridge = "webcoder.bridge.__main__:main"
webcoder = "webcoder.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["webcoder*"]

[tool.setuptools.package-data]
"webcoder.hub" = ["static/*", "installers/*", "extension/*", "extension/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported from CodePier (MIT): its long-line style is kept to ease comparing with upstream.
"webcoder/hub/collaboration/*" = ["E501"]
# migrate_chatroom defines its resolver per room and calls it within the same iteration.
"webcoder/hub/collaboration/schema.py" = ["E501", "B023"]
# Tests ported from CodePier keep its compact style.
"tests/test_collaboration_*.py" = ["E501", "E701", "E702", "F841", "B905"]
"tests/test_mcp_events_*.py" = ["E501", "E701", "E702"]
