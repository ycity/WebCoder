<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebCoder</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --line: #d1d5db; --accent: #2563eb; }
  body { font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 16px 18px; min-width: 340px; max-width: 520px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .status { display: flex; gap: 8px; align-items: baseline; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex: none; transform: translateY(-1px); }
  .dot.online { background: #16a34a; } .dot.offline, .dot.error { background: #d97706; } .dot.unlinked { background: #9ca3af; }
  .detail { color: var(--muted); font-size: 12px; word-break: break-all; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input { box-sizing: border-box; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
    font: inherit; background: transparent; color: inherit; }
  button { margin-top: 12px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.plain { background: transparent; color: inherit; border-color: var(--line); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
  code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 5px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 1em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>WebCoder</h1>
<div class="status"><span id="dot" class="dot"></span><div><div id="state">…</div><div id="detail" class="detail"></div></div></div>

<section id="link" hidden>
  <label for="hub">Hub 地址</label>
  <input id="hub" placeholder="https://你的hub" autocomplete="off">
  <label for="code">连接码（在终端运行 <code>webc link</code> 获取）</label>
  <input id="code" placeholder="ABCD-EFGH" autocomplete="off" spellcheck="false">
  <button id="pair">连接</button>
  <div id="pair-error" class="error"></div>
</section>

<section id="linked" hidden>
  <label for="name">这个浏览器的名字（webc --browser 用它来挑选浏览器）</label>
  <div class="row"><input id="name"><button id="rename" class="plain" style="flex:none;margin-top:0">保存</button></div>
  <div id="running" class="hint"></div>
  <button id="unlink" class="plain">断开连接</button>
</section>

<p class="hint">在项目文件夹里运行 <code>webc "要做的事"</code>，任务会在后台标签页里发给 ChatGPT（需要已登录，并已添加 WebCoder 应用）。</p>
<script src="options.js"></script>
</body>
</html>
